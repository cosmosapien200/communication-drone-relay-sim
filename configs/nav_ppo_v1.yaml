# Run: nav_ppo_v1 — navigation PPO, curriculum levels 1-4 (SPEC Section 8, phase N1)
# Reward: path-distance progress normalised by start path distance, time cost 5e-4/step,
#         proximity penalty below 1 m, -1 collision (ends), +1 success within 1 m.
behaviors:
  Nav:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 32768
      learning_rate: 3.0e-4
      beta: 3.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 30000000
    time_horizon: 256
    summary_freq: 50000
    checkpoint_interval: 1000000
    keep_checkpoints: 30
environment_parameters:
  level:
    curriculum:
      - name: L1
        completion_criteria: {measure: reward, behavior: Nav, signal_smoothing: true, min_lesson_length: 2000, threshold: 1.6}
        value: 1.0
      - name: L2
        completion_criteria: {measure: reward, behavior: Nav, signal_smoothing: true, min_lesson_length: 2000, threshold: 1.55}
        value: 2.0
      - name: L3
        completion_criteria: {measure: reward, behavior: Nav, signal_smoothing: true, min_lesson_length: 3000, threshold: 1.5}
        value: 3.0
      - name: L4
        value: 4.0
torch_settings:
  device: cpu
