[project]
name = "commdrone"
version = "0.1.0"
requires-python = "==3.10.12"
dependencies = [
  "mlagents==1.1.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "ultralytics",
  "tensorboard",
  "numpy<1.24",
  "matplotlib",
  "opencv-python-headless<4.11",
  "psutil",
  "onnxruntime",
  "setuptools<70",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
